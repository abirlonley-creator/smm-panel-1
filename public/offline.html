<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline • AuraSMM</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #F8F9FD;
      color: #252943;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
      text-align: center;
    }
    .card {
      background: #ffffff;
      border: 1px solid #DEE0ED;
      border-radius: 24px;
      padding: 40px 32px;
      max-width: 420px;
      box-shadow: 0 10px 25px rgba(37, 41, 67, 0.05);
    }
    .badge {
      display: inline-block;
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 1px;
      text-transform: uppercase;
      background: #252943;
      color: #E3FF3B;
      padding: 4px 10px;
      border-radius: 6px;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 20px;
      font-weight: 800;
      margin: 0 0 8px 0;
    }
    p {
      font-size: 13px;
      color: rgba(37, 41, 67, 0.7);
      line-height: 1.5;
      margin: 0 0 24px 0;
    }
    button {
      background: #3A4EFB;
      color: #ffffff;
      border: none;
      border-radius: 12px;
      padding: 10px 20px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">AuraSMM Offline</div>
    <h1>Reconnecting...</h1>
    <p>You appear to be offline or on a low-network connection. Your queued actions are preserved, and AuraSMM will automatically reconnect when your signal is restored.</p>
    <button onclick="window.location.reload()">Retry Connection</button>
  </div>
</body>
</html>
